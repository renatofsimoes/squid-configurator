acl rede_local src 10.0.0.0/24 192.168.0.0/24
acl sites_bloqueados dstdomain .youtube.com
acl minha_acl src 192.168.0.0/24
http_access allow rede_local
delay_pools 3
delay_class 3 2
delay_class 2 1
delay_class 1 2
delay_parameters 2 10000/60000
delay_parameters 1 10000/20000
cache_mem 256 MB
maximum_object_size 10 MB
cache_dir /var/cache/squid
